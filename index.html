<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dust Cloaks</title>
<style>
body{margin:0;overflow:hidden;background:#1a1815;font-family:Georgia,'Times New Roman',serif;color:var(--ink);user-select:none}
#gameCanvas{display:block;image-rendering:pixelated}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:34px 16px 150px;box-sizing:border-box;overflow-y:auto;z-index:10}
.menu-screen{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(70,45,20,.42) 100%),var(--parch,#d8c9a8);background-size:auto,256px 256px}
.overlay-screen{background:rgba(0,0,0,.86);color:#dcdcdc}
.hidden{display:none!important}
h1{color:var(--ink-soft);font-weight:900;font-size:56px;font-variant:small-caps;margin:6px 0 4px;text-decoration:underline}
.overlay-screen h1{color:var(--gold);text-decoration:none;font-size:34px;text-shadow:2px 2px 0 #000}
h2.sec{width:100%;max-width:1150px;text-align:center;color:var(--ink-soft);border-bottom:3px solid var(--ink-soft);margin:26px 0 14px;
  font-size:22px;text-transform:uppercase;letter-spacing:2px}
.sub{font-size:15px;margin:0 0 6px;max-width:760px;text-align:center;line-height:1.5}
.btn{background:var(--ink-soft);border:3px solid var(--ink);color:var(--parchment);padding:12px 30px;font-size:19px;font-weight:bold;cursor:pointer;
  margin:8px;font-family:Georgia,serif;border-radius:4px;box-shadow:3px 3px 7px rgba(0,0,0,.4);transition:transform .15s}
.btn:hover{background:#5d4e3e;transform:scale(1.04)}
.btn.small{padding:7px 16px;font-size:14px;margin:4px}
.btn.gold{background:#7a5a14;border-color:#3a2a05}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:1180px}
.card{background:rgba(245,235,215,.94);border:2px solid var(--ink-soft);width:206px;padding:12px;display:flex;flex-direction:column;
  align-items:center;cursor:pointer;color:#1a1a1a;box-shadow:2px 2px 5px rgba(0,0,0,.3);border-radius:4px;transition:transform .15s;position:relative;box-sizing:border-box}
.card:hover{transform:translateY(-4px);background:#fff;border-color:#000}
.card.static{cursor:default}.card.static:hover{transform:none;background:rgba(245,235,215,.94);border-color:var(--ink-soft)}
.card.sel{border-color:#228b22;border-width:3px;background:#e4f2e0}
.card.off{opacity:.5;pointer-events:none;filter:grayscale(.6)}
img.ic{height:64px;image-rendering:pixelated;margin-bottom:4px}
img.ic.sm{height:44px}
.tag{font-family:Georgia,sans-serif;font-size:14px;letter-spacing:0.5px;text-transform:uppercase;color:#f5efe3;background:var(--blood);
  padding:2px 6px;border-radius:2px;align-self:center;margin-bottom:5px}
.ttl{font-size:17px;font-weight:bold;text-align:center;margin:2px 0}
.role{font-size:14px;font-style:italic;text-align:center;color:#444;margin-bottom:5px;font-weight:bold}
.desc{font-size:14px;text-align:center;line-height:1.4;color:#333}
.fl{font-size:14px;font-style:italic;color:#6b6257;margin-top:6px;text-align:center;border-top:1px solid #c9bba4;padding-top:5px}
.stat{font-family:monospace;font-size:14px;background:rgba(0,0,0,.06);padding:4px 6px;border-radius:3px;margin:4px 0;width:100%;box-sizing:border-box;text-align:center}
.cost{color:#8b0000;font-weight:bold;font-size:14px;margin-top:4px;text-align:center}
.owned{color:#228b22;font-weight:bold;font-size:14px;margin-top:4px}
.mini{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:6px}
.mini button{font-size:14px;padding:3px 6px;font-family:Georgia;cursor:pointer;border:1px solid var(--ink-soft);background:#f5efe3;border-radius:2px}
.mini button:hover{background:var(--ink-soft);color:#fff}
.mini button:disabled{opacity:.35;pointer-events:none}
.money{font-size:26px;font-weight:900;color:var(--ink-soft);margin:4px 0}
.overlay-screen .money{color:#ffd700}
.cols{display:flex;gap:16px;width:96%;max-width:1320px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.col{flex:1;min-width:300px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px}
.colh{text-align:center;color:var(--gold);font-size:19px;font-weight:bold;border-bottom:2px solid var(--ink-soft);text-transform:uppercase;padding-bottom:4px;margin-bottom:10px}
.colnote{text-align:center;font-size:14px;color:#aaa;margin:-4px 0 10px}
.colrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.col .card{width:186px}
.log{max-width:760px;width:100%;background:rgba(245,235,215,.92);border:2px solid var(--ink-soft);border-radius:4px;padding:12px 18px;font-size:14.5px;line-height:1.55;box-sizing:border-box}
.log p{margin:3px 0}.log .good{color:#226b2a}.log .bad{color:#8b0000}.log b{color:#000}
#camp-visuals{position:fixed;bottom:0;left:0;width:100%;height:150px;pointer-events:none;z-index:11}
.camp-building{position:absolute;bottom:14px;transform:translateX(-50%);image-rendering:pixelated;height:84px}
.inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%}
input.name{padding:8px;font-size:22px;background:rgba(255,255,255,.85);border:2px solid var(--ink-soft);font-family:inherit;font-weight:bold;width:300px;text-align:center}
table.man{border-collapse:collapse;background:rgba(245,235,215,.92);font-size:14px;max-width:1000px}
table.man td,table.man th{border:1px solid #a89676;padding:4px 7px;text-align:left;vertical-align:middle}
table.man th{background:var(--ink-soft);color:var(--parchment)}
table.man img{height:40px;image-rendering:pixelated}
.kbd{background:var(--ink);color:var(--parchment);padding:1px 6px;border-radius:3px;font-family:monospace;font-size:14px}

/* ---- camp, sheets and the planning table ---- */
#gameCanvas.campview{cursor:grab}
#gameCanvas.campview.point{cursor:pointer}
.splash-screen{background:radial-gradient(ellipse at center,rgba(10,8,6,.35) 0%,rgba(10,8,6,.82) 100%);justify-content:center;padding:20px}
.splash-screen h1{color:#f0e2bf;text-decoration:none;font-size:84px;text-shadow:0 4px 0 #2a1a0a,0 0 30px rgba(0,0,0,.8);margin:0}
.splash-screen .sub{color:#e8d8b0;font-size:18px;text-shadow:0 2px 4px #000}
.splash-screen .note{color:#cdbf9f;font-size:14px;margin:10px 0 18px}
.sheet-screen{background:rgba(12,9,6,.62);padding:66px 16px 40px;justify-content:flex-start}
.sheet{position:relative;max-width:1180px;width:100%;margin:0 auto;background:var(--parch,#d8c9a8);background-size:256px;border:3px solid #3a2a1a;
  box-shadow:0 0 0 2px #8a6a3a inset,0 14px 40px rgba(0,0,0,.65);padding:22px 26px 28px;border-radius:3px;box-sizing:border-box}
.sheet h1{text-decoration:none;font-size:40px;border-bottom:3px double var(--ink-soft);padding-bottom:4px}
.sheet.report{max-width:840px}
.sheet .x,#camp-panel .x{position:absolute;top:6px;right:10px;background:none;border:none;font-size:30px;line-height:1;color:var(--ink-soft);cursor:pointer;font-family:Georgia}
.sheet .x:hover,#camp-panel .x:hover{color:#8b0000}
#topbar{position:fixed;top:0;left:0;right:0;height:48px;z-index:14;display:flex;align-items:center;gap:10px;padding:0 12px;box-sizing:border-box;
  background:linear-gradient(#4a3420,#2c1e12);border-bottom:3px solid #b8902a;box-shadow:0 3px 10px rgba(0,0,0,.5);color:var(--parchment);font-family:Georgia}
#topbar .brand{font-variant:small-caps;font-weight:900;font-size:22px;color:#f0d890;letter-spacing:1px;margin-right:6px;white-space:nowrap}
#topbar .stat{font-family:Georgia;font-size:14px;background:rgba(0,0,0,.25);border:1px solid rgba(255,220,140,.25);color:var(--parchment);padding:4px 10px;border-radius:3px;margin:0;width:auto;white-space:nowrap}
#topbar .stat b{color:var(--gold-bright)}
#topbar .grow{flex:1}
#topbar .tb{background:#5a4028;border:2px solid #22160c;color:#f5ead2;font:bold 14px Georgia;padding:6px 12px;cursor:pointer;border-radius:3px;white-space:nowrap}
#topbar .tb:hover{background:#7a5636}
#topbar .tb.gold{background:#8a6414;color:#fff6d8}
#topbar .tb.gold:hover{background:#a87a1c}
#tb-settings{position:fixed;top:54px;right:12px;z-index:15;background:var(--parch);border:3px solid #3a2a1a;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.6);max-width:520px}
#camp-panel{--cpt:clamp(72px,calc(72px + (100vw - 1280px)*0.0125),80px);--cpr:clamp(32px,calc(32px + (100vw - 1280px)*0.025),48px);position:fixed;top:var(--cpt);right:var(--cpr);width:380px;max-width:calc(100vw - 64px);max-height:calc(100vh - var(--cpt) - var(--cpr));overflow-y:auto;z-index:13;
  background:var(--parch,#d8c9a8);background-size:256px;border:3px solid #3a2a1a;box-shadow:0 0 0 2px #8a6a3a inset,0 10px 30px rgba(0,0,0,.6);
  padding:16px 16px 18px;box-sizing:border-box;border-radius:3px;color:#1a1a1a}
#camp-panel h2{margin:0 26px 4px 0;font-variant:small-caps;color:#3a2a1a;font-size:24px}
#camp-panel .pimg{display:block;margin:4px auto 6px;height:96px;image-rendering:pixelated}
#camp-panel .card{width:100%}
#camp-panel .btn{display:block;width:100%;margin:6px 0;font-size:15px;padding:9px}
#camp-panel .line{display:flex;align-items:center;gap:8px;border-top:1px solid #c9bba4;padding:5px 0;font-size:14px}
#camp-panel .line img{height:34px;image-rendering:pixelated}
#camp-panel .line .grow{flex:1}
#camp-panel .line button{font-size:14px;padding:3px 6px;cursor:pointer;border:1px solid var(--ink-soft);background:#f5efe3;border-radius:2px}
#camp-hint{position:fixed;left:12px;bottom:10px;z-index:12;color:var(--parchment);font:14px Georgia;text-shadow:0 1px 3px #000;background:rgba(20,14,8,.55);padding:5px 10px;border-radius:3px}
.table-screen{padding:60px 0 0;justify-content:flex-start;background:#3a2414}
#table-inner{position:relative;width:100%;min-height:100%;box-sizing:border-box;padding:16px 18px 50px;background-size:288px;
  box-shadow:inset 0 0 120px rgba(0,0,0,.75)}
.table-head{display:flex;align-items:center;gap:14px;max-width:1320px;margin:0 auto 4px}
.table-head h1{color:#f0d890;text-decoration:none;text-shadow:0 3px 0 var(--wood-night);font-size:42px;margin:0;flex:1}
.table-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px 26px;max-width:1320px;margin:0 auto;position:relative;z-index:1}
@media (max-width:980px){.table-grid{grid-template-columns:1fr}}
.prop{position:absolute;image-rendering:pixelated;pointer-events:none;z-index:0;filter:drop-shadow(3px 5px 3px rgba(0,0,0,.55))}
.scroll{position:relative;background:var(--parch,#d8c9a8);background-size:256px;padding:22px 20px 20px;margin:20px 8px 14px;color:var(--ink);
  box-shadow:0 8px 16px rgba(0,0,0,.55),inset 0 0 30px rgba(120,80,30,.25)}
.scroll::before,.scroll::after{content:'';position:absolute;left:-12px;right:-12px;height:16px;border-radius:8px;
  background:linear-gradient(#a8743a,#6a4220 55%,#3a2410);box-shadow:0 3px 4px rgba(0,0,0,.55)}
.scroll::before{top:-8px}.scroll::after{bottom:-8px}
.scroll h3{margin:0 0 8px;font-variant:small-caps;font-size:23px;color:#3a2a1a;border-bottom:2px solid rgba(74,59,42,.5);padding-bottom:3px}
.scroll .sub{max-width:none;text-align:left;font-size:14px}
.cscrolls{display:flex;gap:16px;flex-wrap:wrap}
.cscroll{flex:1;min-width:170px;margin:12px 4px 8px;padding:20px 14px 16px;cursor:pointer;transition:transform .15s}
.cscroll:hover{transform:translateY(-3px)}
.cscroll.sel{transform:translateY(-6px);box-shadow:0 0 0 3px var(--gold),0 14px 20px rgba(0,0,0,.6)}
.cscroll .seal{position:absolute;right:8px;bottom:10px;width:48px;image-rendering:pixelated}
.cscroll .ttl{text-align:left;font-size:17px}
.cscroll .desc{text-align:left}
.council{display:flex;gap:14px;align-items:flex-start}
.council .master{width:96px;flex:none;text-align:center;font-size:14px;font-style:italic}
.council .master img{height:96px;image-rendering:pixelated;display:block;margin:0 auto}
.speech{position:relative;background:#fff8e6;border:2px solid var(--ink-soft);border-radius:6px;padding:8px 12px;font-style:italic;font-size:15px;margin-bottom:8px}
.speech::before{content:'';position:absolute;left:-10px;top:16px;border:8px solid transparent;border-right-color:var(--ink-soft)}
.dice{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0}
.die{min-width:86px;max-width:120px;text-align:center;font-size:14px;overflow-wrap:anywhere}
.die b{display:block;margin:0 auto 3px;width:52px;height:52px;line-height:52px;font-size:26px;border-radius:8px;background:#f8f2e2;border:3px solid var(--ink);box-shadow:2px 3px 0 var(--ink)}
.die.success b{background:#dff0d6;color:#1e5a24}.die.partial b{background:#f5ebc8;color:#7a5a14}.die.miss b{background:#f2d8d0;color:#8b0000}
.edges{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.edge{flex:1;min-width:150px;border:2px dashed #7a5a2a;padding:8px;cursor:pointer;background:rgba(255,250,235,.6)}
.edge:hover{background:#fff;border-style:solid}
.edge.on{border:2px solid #226b2a;background:#e4f2e0}
.marchers{display:flex;gap:8px;flex-wrap:wrap}
.marcher{min-width:92px;max-width:124px;overflow-wrap:anywhere;text-align:center;font-size:14px;cursor:pointer;border:2px solid transparent;padding:4px 2px;border-radius:3px;background:rgba(255,250,235,.45)}
.marcher img{height:58px;image-rendering:pixelated;display:block;margin:0 auto}
.marcher b{display:block;font-size:14px}
.marcher.on{border-color:#226b2a;background:#e4f2e0}
.marcher.off{opacity:.45;pointer-events:none}
.sealbtn{display:flex;align-items:center;gap:10px;margin:14px auto 0;background:none;border:none;cursor:pointer;font:bold 20px Georgia;color:#6a1414}
.sealbtn img{width:64px;image-rendering:pixelated;transition:transform .15s}
.sealbtn:hover img{transform:scale(1.12) rotate(-8deg)}
.sealbtn:disabled{opacity:.4;pointer-events:none}
.miles p{margin:3px 0;font-size:14px}
.miles .done{color:#1e5a24;text-decoration:line-through;text-decoration-color:rgba(30,90,36,.5)}
.miles .next{font-weight:bold}
.amb{display:flex;gap:10px;flex-wrap:wrap}
.amb .cscroll{min-width:200px}
.mapwrap{position:relative}
.mapwrap>img{width:100%;image-rendering:pixelated;display:block;border:2px solid var(--ink-soft)}
.fseal{position:absolute;transform:translate(-50%,-50%);text-align:center;width:120px;font-size:14px;font-weight:bold;color:#2a1a0a;text-shadow:0 0 3px #f5ead2,0 0 3px #f5ead2}
.fseal img{width:44px;image-rendering:pixelated;display:block;margin:0 auto}
.fseal .n{font-size:1.07em}
.fseal.ally .n{color:#1e6a24}.fseal.host .n{color:#9a0000}
.flist p{margin:2px 0;font-size:14px}
.ledger .line{display:flex;align-items:center;gap:8px;border-top:1px solid rgba(74,59,42,.35);padding:5px 0;font-size:14px}
.ledger .line img{height:38px;image-rendering:pixelated}
.ledger .line .grow{flex:1}
.ledger button{font-size:14px;padding:3px 6px;cursor:pointer;border:1px solid var(--ink-soft);background:#f5efe3;border-radius:2px;margin:1px}
.advbox{background:rgba(255,250,232,.85);border:2px solid #7a5a2a;padding:10px 14px;margin:12px auto;max-width:900px;text-align:left;border-radius:3px}
.advbox .line{display:flex;align-items:center;gap:8px;border-top:1px solid #c9bba4;padding:5px 0;font-size:14px}
.advbox .line img{height:38px;image-rendering:pixelated}.advbox .line .grow{flex:1}
.advbox button{font-size:14px;padding:3px 7px;cursor:pointer;border:1px solid var(--ink-soft);background:#f5efe3;border-radius:2px;margin:1px}
</style>
</head>

<canvas id="gameCanvas"></canvas>

<div id="screen-title"   class="screen splash-screen"><div class="inner" id="title-inner"></div></div>
<div id="screen-create"  class="screen sheet-screen hidden"><div class="sheet"><div class="inner" id="create-inner"></div></div></div>
<div id="screen-roster"  class="screen sheet-screen hidden"><div class="sheet"><button class="x" onclick="renderTitle()" title="Back to camp">&#215;</button><div class="inner" id="roster-inner"></div></div></div>

<div id="screen-debrief" class="screen sheet-screen hidden"><div class="sheet report"><div class="inner" id="debrief-inner"></div></div></div>
